name: Rebuild frozen scoreboard

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you rebuilding the final files?"
        required: false
        default: "Manual rebuild of frozen scoreboard"

permissions:
  contents: write

jobs:
  update-scoreboard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: worldcup-tronky
          auto-activate-base: false

      - name: Rebuild final scoreboard files
        shell: bash -el {0}
        run: |
          python scripts/score_predictions.py

      - name: Commit updated scoreboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          git diff --cached --quiet || git commit -m "Update scoreboard data"
          git push
